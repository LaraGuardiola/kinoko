# The checks (oxlint, tsc, bun test) on Linux, macOS and Windows: kinoko runs on all three.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false # every system's result, not only the first to fail
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bun test
