# A release: pushing a tag v* (the same as package.json's version) checks, builds the binaries for
# Linux, macOS and Windows, and publishes them with their SHA256SUMS and the CHANGELOG's section.
# install.sh and install.ps1 download from here.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, targets: "linux-x64 linux-arm64 windows-x64" }
          # macOS binaries built on macOS: signed (ad hoc), which Apple Silicon requires to run them.
          - { os: macos-latest, targets: "darwin-x64 darwin-arm64" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: the tag is package.json's version
        shell: bash
        run: test "v$(bun -e 'console.log((await Bun.file("package.json").json()).version)')" = "$GITHUB_REF_NAME"
      - name: binaries
        shell: bash
        run: |
          mkdir -p dist
          for target in ${{ matrix.targets }}; do
            ext=""; [ "$target" = windows-x64 ] && ext=".exe"
            bun build --compile --target="bun-$target" --outfile "dist/kinoko-$target$ext" src/main.ts
            if [ "$RUNNER_OS" = macOS ]; then codesign --force --sign - "dist/kinoko-$target"; fi
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum kinoko-* > SHA256SUMS && cat SHA256SUMS
      - name: notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          test -s notes.md
          cat >> notes.md <<'EOF'

          ### Install
          Linux and macOS: `curl -fsSL https://raw.githubusercontent.com/LaraGuardiola/kinoko/main/install.sh | sh`
          Windows (PowerShell): `irm https://raw.githubusercontent.com/LaraGuardiola/kinoko/main/install.ps1 | iex`
          EOF
      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "kinoko $GITHUB_REF_NAME" --notes-file notes.md
